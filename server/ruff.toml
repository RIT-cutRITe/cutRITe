# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 100
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[lint]
# Enforces STYLEGUIDE.md. See https://docs.astral.sh/ruff/rules/ for each code.
select = [
    "E", "W",  # pycodestyle (PEP 8)
    "F",       # pyflakes, incl. F403 no wildcard imports
    "I",       # import sorting/grouping
    "N",       # PEP 8 naming
    "UP",      # modern syntax: list[str], X | None
    "ANN",     # type hints on every parameter and return
    "D",       # docstrings
    "FAST",    # FastAPI: Annotated params, no redundant response_model
    "BLE",     # no blind `except Exception`
    "S110",    # no `except: pass`
    "LOG",     # logging misuse, e.g. getLogger without __name__
    "G",       # no f-strings/format() in log calls
    "T20",     # no print()
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[\\p{XID_Continue}]*[\\p{XID_Continue}--_]+?))$"

[lint.pydocstyle]
convention = "google"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"