name: Vitest

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/vitest.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/vitest.yml"]

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets the actions post PR comments
      checks: write # used by the test-results action
    defaults:
      run:
        working-directory: frontend/vue-i
    env:
      # Skip Cyrpess Install
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # update with frontend/Dockerfile if it updates
          cache: yarn
          cache-dependency-path: frontend/vue-i/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test:unit --run --coverage

      - name: Coverage comment
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontend/vue-i

      - name: Test results comment
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/vue-i/test-results/junit.xml
