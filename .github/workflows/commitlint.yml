name: commitlint

on:
  push:
    branches: [ "main" ]
  # pull_request:
    # branches: [ "main" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # pull_req_setup:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     matrix: ${{ steps.matrix.outputs.value }}
  #   steps:
  #     run: ${{ github.event.pull_request.base.sha }}

  # This workflow contains a single job called "build"
  commitlint:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # worth noting: this hardcodes the version of commitlint...
      # there is a go package that updates with the repo but i dont know how go works
      - name: Lint most recent commit
        run: |
          wget https://github.com/conventionalcommit/commitlint/releases/download/v0.12.0/commitlint_v0.12.0_linux_386.tar.gz
          unzip commitlint_v0.12.0_linux_386.tar.gz
          mv commitlint_v0.12.0_linux_386/commitlint ~/.local/bin/commitlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint most recent commit (on any push)
        # if: github.event_name == 'push'
        run: commitlint lint --message=${{ github.event.push.head_commit.message }}

      # - name: Lint all commits in a pull request
      #   if: github.event_name == 'pull_request'
      #   run: |
      #     commitlint lint --message=${{}}
